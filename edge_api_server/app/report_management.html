<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>보고서/파일 관리</title>
  <style>
    :root{font-family:Arial,"Noto Sans KR",sans-serif;color:#172033;background:#f4f6f8}*{box-sizing:border-box}body{margin:0}.top{min-height:64px;background:#fff;border-bottom:1px solid #d8dee8;display:flex;align-items:center;justify-content:space-between;padding:0 24px}.top h1{font-size:21px;margin:0}.top a,.tab{text-decoration:none}.top a{color:#42526b}.wrap{padding:20px 24px 40px}.tabs{display:flex;gap:4px;border-bottom:1px solid #ccd5e1;margin-bottom:16px}.tab{color:#657286;font-weight:700;padding:11px 18px;border-bottom:3px solid transparent}.tab.active{color:#183153;border-color:#2563eb}.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:9px;margin-bottom:12px}.stat,.panel,.summary{background:#fff;border:1px solid #d8dee8;border-radius:7px}.stat{padding:13px;min-width:0}.stat b{display:block;font-size:12px;color:#687587;margin-bottom:6px}.stat strong{font-size:20px;overflow-wrap:anywhere}.summary{padding:12px 14px;margin-bottom:12px}.summary-row{display:flex;gap:16px;flex-wrap:wrap}.summary details{margin-top:8px}.summary code{overflow-wrap:anywhere}.filters{display:grid;grid-template-columns:150px 170px minmax(220px,1fr) auto auto;gap:8px;margin-bottom:10px}.filters select,.filters input,.filters button,.bulk button,.actions button,.retention button{height:40px;border:1px solid #bcc7d6;border-radius:6px;background:#fff;padding:0 11px;font:inherit}.filters button,.bulk .primary{background:#183153;color:#fff;border-color:#183153;cursor:pointer}.filters .secondary,.bulk button,.actions button,.retention button{background:#fff;color:#183153;cursor:pointer}.bulk{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 10px}.bulk .danger,.actions .danger{color:#a11b1b;border-color:#d7a4a4}.bulk button:disabled{opacity:.45;cursor:not-allowed}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:1380px}th,td{border-bottom:1px solid #e4e8ef;padding:10px 11px;text-align:left;font-size:13px;vertical-align:top}th{background:#eef2f6;color:#405069;position:sticky;top:0;z-index:1}tbody tr{cursor:pointer}tbody tr:hover{background:#f7f9fc}.select-cell{width:42px;text-align:center}.badge{display:inline-block;border-radius:12px;padding:3px 8px;font-size:12px;background:#e8edf4;white-space:nowrap}.badge.COMPLETED,.badge.READY{background:#dcfce7;color:#166534}.badge.FAILED,.badge.CANCELLED{background:#fee2e2;color:#9b1c1c}.badge.PENDING,.badge.PROCESSING,.badge.RETRY_WAIT{background:#fef3c7;color:#92400e}.warn{color:#b42318;font-weight:700}.muted{color:#6b7788}.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.empty{padding:50px;text-align:center;color:#738096}.detail-backdrop{display:none;position:fixed;inset:0;background:rgba(15,23,42,.38);z-index:1000}.detail-backdrop.open{display:block}.detail{display:none;position:fixed;z-index:1001;top:12px;right:12px;bottom:12px;width:min(920px,calc(100vw - 48px));overflow:auto;box-shadow:0 18px 50px rgba(15,23,42,.24)}.detail.open{display:block}.toolbar{position:sticky;top:0;z-index:2;background:#fff;border-bottom:1px solid #d8dee8;padding:10px 16px;display:flex;justify-content:space-between;align-items:center}.toolbar button{border:0;background:transparent;font-size:26px;cursor:pointer}.content{padding:18px}.head{display:flex;justify-content:space-between;gap:16px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.actions button{height:36px}.retention{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:10px 0 14px}.retention input{height:36px;border:1px solid #bcc7d6;border-radius:5px;padding:0 8px}.meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.meta div{background:#f5f7fa;padding:10px;border-radius:5px;overflow-wrap:anywhere}.meta b{display:block;font-size:11px;color:#687587;margin-bottom:4px}.artifact{display:grid;grid-template-columns:80px minmax(0,1fr) 100px 95px;gap:8px;align-items:center;border:1px solid #dce2ea;border-radius:5px;padding:8px;margin:6px 0}.artifact a{word-break:break-all}.attempt{padding:8px;border-bottom:1px solid #e4e8ef}body.detail-open{overflow:hidden}
    @media(max-width:1100px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media(max-width:900px){.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.meta{grid-template-columns:1fr 1fr}}
    @media(max-width:640px){.top{padding:12px 14px}.wrap{padding:14px}.tab{padding:10px 8px;font-size:13px}.stats,.filters,.meta{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.detail{inset:0;width:100%;max-width:none;border:0}.artifact{grid-template-columns:70px 1fr}.artifact span:last-child{grid-column:2}.head{display:block}}
  </style>
</head>
<body>
  <header class="top"><h1>RIST 운영 관리</h1><a href="/">작업 화면</a></header>
  <main class="wrap">
    <nav class="tabs"><a class="tab" href="/operations">사용 기록</a><a class="tab" href="/errors">오류 기록</a><a class="tab active" href="/report-management">보고서/파일 관리</a></nav>
    <section class="stats">
      <div class="stat"><b>보고서</b><strong id="report-count">-</strong></div>
      <div class="stat"><b>등록 파일 용량</b><strong id="registered-size">-</strong></div>
      <div class="stat"><b>실제 저장소 용량</b><strong id="physical-size">-</strong></div>
      <div class="stat"><b>휴지통 용량</b><strong id="trash-size">-</strong></div>
      <div class="stat"><b>누락 파일</b><strong id="missing-count">-</strong></div>
      <div class="stat"><b>미등록 파일</b><strong id="orphan-count">-</strong></div>
    </section>
    <section class="summary" id="summary"></section>
    <section class="filters">
      <select id="project"><option value="">전체 프로젝트</option><option>FT-IR</option><option>RAMAN</option><option>XRD</option><option>TEM</option></select>
      <select id="status"><option value="">전체 전송 상태</option><option>NOT_QUEUED</option><option>PENDING</option><option>PROCESSING</option><option>RETRY_WAIT</option><option>COMPLETED</option><option>FAILED</option><option>CANCELLED</option></select>
      <input id="query" placeholder="의뢰번호, 보고서 ID, 장비, 실험자 검색">
      <button id="refresh">조회</button><button class="secondary" id="cleanup-preview">정리 대상 미리보기</button>
    </section>
    <section class="bulk"><b id="selected-count">0건 선택</b><button id="clear-selection">선택 해제</button><button class="danger" id="cleanup-selected" disabled>선택 항목 휴지통 이동</button></section>
    <section class="panel table-wrap">
      <table><thead><tr><th class="select-cell"><input id="select-all" type="checkbox" aria-label="현재 목록 전체 선택"></th><th>생성 시각</th><th>의뢰번호</th><th>프로젝트</th><th>장비 / 실험자</th><th>생성 상태</th><th>전송 상태</th><th>파일</th><th>크기</th><th>보존 정책</th><th>최근 오류</th></tr></thead><tbody id="rows"></tbody></table>
      <div class="empty" id="empty" hidden>보고서 기록이 없습니다.</div>
    </section>
  </main>
  <div class="detail-backdrop" id="backdrop"></div><section class="panel detail" id="detail"></section>
  <script>
    (()=>{
      const $=id=>document.getElementById(id), selected=new Set();
      const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const size=v=>{let n=Number(v||0),u=['B','KB','MB','GB','TB'],i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return(i?n.toFixed(1):n)+' '+u[i]};
      const date=v=>v?new Date(v).toLocaleString('ko-KR'):'-';
      const localValue=v=>{if(!v)return'';const d=new Date(v),pad=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`};
      async function api(url,opt){const r=await fetch(url,opt);if(!r.ok){let m='요청 처리 실패';try{const p=await r.json();m=p.detail||p.message||m}catch(_e){}throw new Error(m)}return r.status===204?null:r.json()}
      const badge=v=>`<span class="badge ${esc(v)}">${esc(v||'NOT_QUEUED')}</span>`;
      function updateSelection(){document.querySelectorAll('.row-select').forEach(c=>c.checked=selected.has(c.value));$('selected-count').textContent=`${selected.size}건 선택`;$('cleanup-selected').disabled=!selected.size;const all=[...document.querySelectorAll('.row-select')];$('select-all').checked=Boolean(all.length)&&all.every(c=>selected.has(c.value));$('select-all').indeterminate=all.some(c=>selected.has(c.value))&&!$('select-all').checked}
      function renderSummary(s){const projects=Object.entries(s.projects||{}).sort().map(([k,v])=>`${esc(k)} ${esc(v.count)}건 / ${esc(size(v.sizeBytes))}`).join(' · ')||'프로젝트별 기록 없음';const orphans=(s.orphanFiles||[]).map(f=>`<li><code>${esc(f.relativePath)}</code> (${esc(size(f.sizeBytes))})</li>`).join('');$('summary').innerHTML=`<div class="summary-row"><b>프로젝트별 사용량</b><span>${projects}</span></div><details><summary>DB에 등록되지 않은 파일 ${esc(s.orphanFileCount)}개</summary>${orphans?`<ul>${orphans}</ul>`:'<p class="muted">없음</p>'}</details>`}
      async function load(){const p=new URLSearchParams({q:$('query').value,experimentCode:$('project').value,transferStatus:$('status').value});const [data,s]=await Promise.all([api('/api/v1/report-management?'+p),api('/api/v1/report-management/summary')]);$('report-count').textContent=s.reportCount+'건';$('registered-size').textContent=size(s.totalSizeBytes);$('physical-size').textContent=size(s.physicalStorageBytes);$('trash-size').textContent=size(s.trashSizeBytes);$('missing-count').textContent=s.missingFileCount+'개';$('orphan-count').textContent=s.orphanFileCount+'개';renderSummary(s);$('empty').hidden=Boolean(data.items.length);$('rows').innerHTML=data.items.map(item=>`<tr data-id="${esc(item.report_id)}"><td class="select-cell"><input class="row-select" type="checkbox" value="${esc(item.report_id)}" aria-label="${esc(item.request_number||item.report_id)} 선택"></td><td>${esc(date(item.generated_at||item.created_at))}</td><td>${esc(item.request_number||'-')}</td><td>${esc(item.experiment_code)}${item.is_test?' · 테스트':''}</td><td>${esc(item.equipment_code||'-')}<br><span class="muted">${esc(item.operator_id||'-')}</span></td><td>${badge(item.generation_status)}</td><td>${badge(item.transfer_status)}<br><span class="muted">${esc(item.attempt_count||0)} / ${esc(item.max_attempts||'-')}</span></td><td>${esc(item.active_artifact_count||0)}개${item.missing_artifact_count?`<br><span class="warn">누락 ${esc(item.missing_artifact_count)}</span>`:''}</td><td>${esc(size(item.artifact_size_bytes))}</td><td>${item.pinned?'보존 지정':esc(item.retentionPolicy)}<br><span class="muted">${esc(date(item.retentionDeadline))}</span></td><td class="${item.last_error_message?'warn':''}">${esc(item.last_error_message||'-')}</td></tr>`).join('');document.querySelectorAll('tr[data-id]').forEach(row=>row.onclick=e=>{if(e.target.closest('input,button,a'))return;show(row.dataset.id).catch(err=>alert(err.message))});document.querySelectorAll('.row-select').forEach(c=>c.onchange=()=>{c.checked?selected.add(c.value):selected.delete(c.value);updateSelection()});updateSelection()}
      function close(){$('detail').className='panel detail';$('detail').innerHTML='';$('backdrop').className='detail-backdrop';document.body.classList.remove('detail-open')}
      async function show(id){const item=await api('/api/v1/report-management/'+encodeURIComponent(id));const artifacts=(item.artifacts||[]).map(a=>`<div class="artifact"><b>${esc(a.artifact_type)}</b><div>${a.downloadUrl?`<a href="${esc(a.downloadUrl)}">${esc(a.file_name)}</a>`:esc(a.file_name)}<br><span class="muted code">${esc(a.relative_path)}</span></div><span>${esc(size(a.actualSizeBytes??a.size_bytes))}</span><span class="${!a.exists||!a.sizeMatches?'warn':''}">${a.deleted_at?'휴지통':!a.exists?'파일 없음':a.sizeMatches?'정상':'크기 불일치'}</span></div>`).join('')||'<p class="muted">등록된 파일이 없습니다.</p>';const attempts=(item.attempts||[]).map(a=>`<div class="attempt"><b>${esc(a.attempt_no)}차 · ${a.success===1?'성공':a.success===0?'실패':'처리 중'}</b> ${esc(date(a.started_at))}<br><span class="muted">${esc(a.error_message||a.response_message||'-')}</span></div>`).join('')||'<p class="muted">전송 시도 기록이 없습니다.</p>';$('detail').className='panel detail open';$('backdrop').className='detail-backdrop open';document.body.classList.add('detail-open');$('detail').innerHTML=`<div class="toolbar"><b>보고서 상세</b><button id="close" title="닫기" aria-label="닫기">&times;</button></div><div class="content"><div class="head"><div><h2>${esc(item.request_number||'의뢰번호 없음')} · ${esc(item.experiment_code)}</h2><span class="muted code">${esc(item.report_id)}</span></div>${badge(item.transfer_status)}</div><div class="actions"><button id="verify">SHA-256 검증</button><button id="test">${item.is_test?'테스트 해제':'테스트 표시'}</button><button id="pin">${item.pinned?'보존 해제':'보존 지정'}</button>${['FAILED','CANCELLED'].includes(item.transfer_status)?'<button id="retry">전송 재시도</button>':''}${['PENDING','RETRY_WAIT'].includes(item.transfer_status)?'<button id="cancel">대기 전송 취소</button>':''}${item.cleanupEligible?'<button class="danger" id="cleanup">휴지통 이동</button>':''}</div><div class="retention"><label for="retention"><b>직접 보존 기한</b></label><input id="retention" type="datetime-local" value="${esc(localValue(item.retention_until))}"><button id="save-retention">저장</button><button id="clear-retention">자동 정책 적용</button></div><div class="meta"><div><b>생성 시각</b>${esc(date(item.generated_at))}</div><div><b>장비</b>${esc(item.equipment_code||'-')}</div><div><b>실험자</b>${esc(item.operator_id||'-')}</div><div><b>보존 정책</b>${esc(item.retentionPolicy)}</div><div><b>정리 가능 시각</b>${esc(date(item.retentionDeadline))}</div><div><b>LIMS 완료</b>${esc(date(item.transfer_completed_at))}</div><div><b>공유 저장소 경로</b><span class="code">${esc(item.package_relative_path||'-')}</span></div><div><b>삭제 상태</b>${esc(date(item.deleted_at))}</div><div><b>최근 오류</b>${esc(item.last_error_message||'-')}</div></div><h3>파일</h3>${artifacts}<h3>전송 시도</h3>${attempts}</div>`;$('close').onclick=close;$('verify').onclick=async()=>{const result=await api('/api/v1/report-management/'+encodeURIComponent(id)+'/verify',{method:'POST'});alert(result.valid?'모든 파일의 SHA-256이 일치합니다.':'누락 또는 해시 불일치 파일이 있습니다.');await show(id)};$('test').onclick=()=>patch(id,{isTest:!item.is_test});$('pin').onclick=()=>patch(id,{pinned:!item.pinned});$('save-retention').onclick=()=>patch(id,{retentionUntil:$('retention').value||null,updateRetention:true});$('clear-retention').onclick=()=>patch(id,{retentionUntil:null,updateRetention:true});const retry=$('retry'),cancel=$('cancel'),cleanup=$('cleanup');if(retry)retry.onclick=()=>action(id,'retry');if(cancel)cancel.onclick=()=>action(id,'cancel');if(cleanup)cleanup.onclick=()=>cleanupReports([id])}
      async function patch(id,payload){await api('/api/v1/report-management/'+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});await show(id);await load()}
      async function action(id,name){await api('/api/v1/report-management/'+encodeURIComponent(id)+'/'+name,{method:'POST'});await show(id);await load()}
      async function cleanupReports(ids){if(!ids.length)return;if(!confirm(`${ids.length}건의 파일을 휴지통으로 이동할까요? DB 이력은 유지됩니다.`))return;await api('/api/v1/report-management/cleanup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reportIds:ids,actor:'운영 관리자',reason:'관리 화면 선택 정리'})});ids.forEach(id=>selected.delete(id));close();await load()}
      $('refresh').onclick=()=>load().catch(e=>alert(e.message));$('cleanup-preview').onclick=async()=>{try{const data=await api('/api/v1/report-management/cleanup-preview');selected.clear();data.items.forEach(i=>selected.add(i.report_id));updateSelection();alert(`정리 대상 ${data.count}건, ${size(data.sizeBytes)}를 선택했습니다. 목록을 검토한 뒤 휴지통 이동을 실행하세요.`)}catch(e){alert(e.message)}};$('cleanup-selected').onclick=()=>cleanupReports([...selected]).catch(e=>alert(e.message));$('clear-selection').onclick=()=>{selected.clear();updateSelection()};$('select-all').onchange=e=>{document.querySelectorAll('.row-select').forEach(c=>e.target.checked?selected.add(c.value):selected.delete(c.value));updateSelection()};$('query').onkeydown=e=>{if(e.key==='Enter')$('refresh').click()};$('backdrop').onclick=close;document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});load().catch(e=>alert(e.message));
    })();
  </script>
</body>
</html>
