  <style>

ground:#fff;color:#183153;cursor:pointer}.bulk{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 10px}.bulk .policy-button{margin-left:auto}.bulk .danger,.actions .danger{color:#a11b1b;border-color:#d7a4a4}.bulk button:disabled{opacity:.45;cursor:not-allowed}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:1380px}th,td{border-bottom:1px solid #e4e8ef;padding:10px 11px;text-align:left;font-size:13px;vertical-align:top}th{background:#eef2f6;color:#405069;position:sticky;top:0;z-index:1}tbody tr{cursor:pointer}tbody tr:hover{background:#f7f9fc}.select-cell{width:42px;text-align:center}.badge{display:inline-block;border-radius:12px;padding:3px 8px;font-size:12px;background:#e8edf4;white-space:nowrap}.badge.COMPLETED,.badge.READY{background:#dcfce7;color:#166534}.badge.FAILED,.badge.CANCELLED{background:#fee2e2;color:#9b1c1c}.badge.PENDING,.badge.PROCESSING,.badge.RETRY_WAIT{background:#fef3c7;color:#92400e}.warn{color:#b42318;font-weight:700}.muted{color:#6b7788}.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.empty{padding:50px;text-align:center;color:#738096}.pager{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:10px 12px;background:#fff;border-top:1px solid #e4e8ef}.pager label{display:flex;align-items:center;gap:6px;color:#526174;font-size:13px}.pager select,.pager button{height:34px;border:1px solid #bcc7d6;border-radius:5px;background:#fff;padding:0 9px;font:inherit}.pager button{cursor:pointer;color:#183153}.pager button:disabled{opacity:.4;cursor:not-allowed}.page-info{min-width:70px;text-align:center;color:#526174;font-size:13px}.detail-backdrop,.policy-backdrop{display:none;position:fixed;inset:0;background:rgba(15,23,42,.38);z-index:1000}.detail-backdrop.open,.policy-backdrop.open{display:block}.detail{display:none;position:fixed;z-index:1001;top:12px;right:12px;bottom:12px;width:min(920px,calc(100vw - 48px));overflow:auto;box-shadow:0 18px 50px rgba(15,23,42,.24)}.detail.open{display:block}.toolbar{position:sticky;top:0;z-index:2;background:#fff;border-bottom:1px solid #d8dee8;padding:10px 16px;display:flex;justify-content:space-between;align-items:center}.toolbar button{border:0;background:transparent;font-size:26px;cursor:pointer}.content{padding:18px}.head{display:flex;justify-content:space-between;gap:16px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.actions button{height:36px}.retention{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:10px 0 14px}.retention input{height:36px;border:1px solid #bcc7d6;border-radius:5px;padding:0 8px}.meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.meta div{background:#f5f7fa;padding:10px;border-radius:5px;overflow-wrap:anywhere}.meta b{display:block;font-size:11px;color:#687587;margin-bottom:4px}.artifact{display:grid;grid-template-columns:80px minmax(0,1fr) 100px 95px;gap:8px;align-items:center;border:1px solid #dce2ea;border-radius:5px;padding:8px;margin:6px 0}.artifact a{word-break:break-all}.attempt{padding:8px;border-bottom:1px solid #e4e8ef}.policy-backdrop{z-index:1100}.policy-modal{display:none;position:fixed;z-index:1101;top:50%;left:50%;transform:translate(-50%,-50%);width:min(820px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 18px 50px rgba(15,23,42,.3)}.policy-modal.open{display:block}.policy-intro{margin:0 0 14px;color:#526174}.policy-list{border-top:1px solid #dce2ea}.policy-row{display:grid;grid-template-columns:minmax(260px,1fr) 120px 150px;gap:14px;align-items:center;padding:14px 2px;border-bottom:1px solid #e4e8ef}.policy-row b{display:block;margin-bottom:4px}.policy-row input[type=number]{width:100%;height:38px;border:1px solid #bcc7d6;border-radius:5px;padding:0 9px;font:inherit}.policy-toggle{display:flex;gap:7px;align-items:center;white-space:nowrap}.fixed-rules{background:#f4f7fb;border-left:3px solid #2563eb;padding:12px 14px;margin-top:16px}.fixed-rules p{margin:6px 0}.policy-actions{position:sticky;bottom:0;background:#fff;border-top:1px solid #d8dee8;padding:12px 18px;display:flex;justify-content:flex-end;gap:8px}body.detail-open,body.policy-open{overflow:hidden}
    .top{flex-wrap:wrap}.top-actions{justify-content:flex-end}.filters{grid-template-columns:160px 180px 142px 142px auto minmax(220px,1fr) auto auto}.multi-filter{position:relative;height:40px;min-width:0}.multi-filter summary{height:40px;display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid #bcc7d6;border-radius:6px;background:#fff;padding:0 11px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;list-style:none}.multi-filter summary::-webkit-details-marker{display:none}.multi-filter summary:after{content:"▾";flex:0 0 auto;color:#64748b}.multi-filter[open] summary{border-color:#2563eb;box-shadow:0 0 0 2px rgba(37,99,235,.12)}.multi-menu{position:absolute;z-index:20;top:44px;left:0;min-width:240px;max-height:310px;overflow:auto;background:#fff;border:1px solid #bcc7d6;border-radius:6px;box-shadow:0 10px 26px rgba(15,23,42,.16);padding:7px}.multi-menu label{display:flex;align-items:center;gap:8px;padding:8px;border-radius:4px;cursor:pointer;white-space:nowrap}.multi-menu label:hover{background:#f1f5f9}.multi-menu input{width:17px;height:17px;margin:0}.multi-menu .clear-filter{width:100%;height:32px;margin-top:5px;background:#fff;color:#334155;border-color:#cbd5e1}.date-clear{background:#fff!important;color:#334155!important;border-color:#bcc7d6!important;white-space:nowrap}.sort-button{width:100%;display:flex;align-items:center;justify-content:space-between;gap:7px;border:0;background:transparent;color:inherit;font:inherit;font-weight:700;padding:0;cursor:pointer;text-align:left}.sort-button .sort-mark{color:#2563eb}.table-wrap table{table-layout:fixed}.table-wrap th,.table-wrap td{overflow:hidden;text-overflow:ellipsis}.table-wrap td{overflow-wrap:anywhere}.table-wrap th{white-space:nowrap}.page-numbers{display:flex;gap:4px}.page-numbers button{min-width:36px;padding:0 8px}.page-numbers button.active{background:#183153;color:#fff;border-color:#183153}.page-jump{width:72px;height:34px;border:1px solid #bcc7d6;border-radius:5px;padding:0 8px;font:inherit}#report-table{width:1529px;min-width:1529px;max-width:1529px}
    @media(max-width:1100px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media(max-width:1100px){.filters{grid-template-columns:repeat(4,minmax(0,1fr))}.filters #query{grid-column:1/-2}.filters #cleanup-preview{grid-column:1/-1}}
    @media(max-width:900px){.filters{grid-template-columns:1fr 1fr}.filters #query{grid-column:1/-1}.meta{grid-template-columns:1fr 1fr}}
    @media(max-width:640px){.top{padding:12px 14px}.top .top-actions{width:100%}.wrap{padding:14px}.tab{padding:10px 8px;font-size:13px}.stats,.filters,.meta{grid-template-columns:1fr 1fr}.filters #query,.filters #cleanup-preview{grid-column:1/-1}.multi-menu{position:fixed;left:14px;right:14px;top:auto;min-width:0}.bulk .policy-button{margin-left:0}.pager{justify-content:center;flex-wrap:wrap}.page-numbers{order:3;width:100%;justify-content:center}.detail{inset:0;width:100%;max-width:none;border:0}.artifact{grid-template-columns:70px 1fr}.artifact span:last-child{grid-column:2}.head{display:block}.policy-row{grid-template-columns:1fr 105px}.policy-row>div:first-child{grid-column:1/-1}.policy-modal{width:100%;max-height:100vh;border-radius:0}}
  </style>
</head>
<body>
  <header class="top"><h1>RIST 운영 관리</h1><div class="top-actions"><a href="/">작업 화면</a><a href="/account">내 계정</a><button class="logout-button" id="logout-button" type="button">로그아웃</button></div></header>
  <main class="wrap">
    <nav class="tabs"><a class="tab" href="/operations">사용 기록</a><a class="tab" href="/errors">오류 기록</a><a class="tab active" href="/report-management">보고서/파일 관리</a><a class="tab" href="/admin/users">회원 관리</a></nav>
    <section class="stats">
      <div class="stat"><b>보고서</b><strong id="report-count">-</strong></div>
      <div class="stat"><b>등록 파일 용량</b><strong id="registered-size">-</strong></div>
      <div class="stat"><b>실제 저장소 용량</b><strong id="physical-size">-</strong></div>
      <div class="stat"><b>휴지통 용량</b><strong id="trash-size">-</strong></div>
      <div class="stat"><b>누락 파일</b><strong id="missing-count">-</strong></div>
      <div class="stat"><b>미등록 파일</b><strong id="orphan-count">-</strong></div>
    </section>
    <section class="summary" id="summary"></section>
    <section class="filters">
      <details class="multi-filter" id="project" data-all-label="전체 프로젝트"><summary>전체 프로젝트</summary><div class="multi-menu">
        <label><input type="checkbox" value="FT-IR">FT-IR</label><label><input type="checkbox" value="RAMAN">RAMAN</label><label><input type="checkbox" value="XRD">XRD</label><label><input type="checkbox" value="TEM">TEM</label>
        <button type="button" class="clear-filter">전체 해제</button>
      </div></details>
      <details class="multi-filter" id="status" data-all-label="전체 전송 상태"><summary>전체 전송 상태</summary><div class="multi-menu">
        <label><input type="checkbox" value="NOT_QUEUED">미등록</label><label><input type="checkbox" value="PENDING">대기</label><label><input type="checkbox" value="PROCESSING">처리 중</label><label><input type="checkbox" value="RETRY_WAIT">재시도 대기</label><label><input type="checkbox" value="COMPLETED">완료</label><label><input type="checkbox" value="FAILED">실패</label><label><input type="checkbox" value="CANCELLED">취소</label>
        <button type="button" class="clear-filter">전체 해제</button>
      </div></details>
      <input id="date-from" type="date" aria-label="시작일">
      <input id="date-to" type="date" aria-label="종료일">
      <button type="button" class="date-clear" id="all-dates">전체 기간</button>
      <input id="query" placeholder="의뢰번호, 보고서 ID, 장비, 실험자 검색">
      <button id="refresh">조회</button><button class="secondary" id="cleanup-preview">정리 대상 미리보기</button>
    </section>
    <section class="bulk"><b id="selected-count">0건 선택</b><button id="clear-selection">선택 해제</button><button class="danger" id="cleanup-selected" disabled>선택 항목 휴지통 이동</button><button class="policy-button" id="open-policies">보존 정책 설정</button></section>
    <section class="panel table-wrap">
      <table id="report-table"><colgroup><col style="width:44px"><col style="width:165px"><col style="width:150px"><col style="width:105px"><col style="width:175px"><col style="width:115px"><col style="width:125px"><col style="width:90px"><col style="width:105px"><col style="width:175px"><col style="width:280px"></colgroup><thead><tr id="head-row"></tr></thead><tbody id="rows"></tbody></table>
      <div class="empty" id="empty" hidden>보고서 기록이 없습니다.</div>
      <div class="pager" aria-label="보고서 목록 페이지 이동">
        <label>페이지당 <select id="page-size"><option>25</option><option>50</option><option>100</option></select></label>
        <button id="first-page" type="button" title="첫 페이지">처음</button><button id="prev-page" type="button">이전</button><div class="page-numbers" id="page-numbers"></div><span class="page-info" id="page-info">1 / 1</span><button id="next-page" type="button">다음</button><button id="last-page" type="button" title="마지막 페이지">끝</button><input class="page-jump" id="page-jump" type="number" min="1" value="1" aria-label="이동할 페이지"><button id="go-page" type="button">이동</button>
      </div>
    </section>
  </main>
  <div class="detail-backdrop" id="backdrop"></div><section class="panel detail" id="detail"></section>
  <div class="policy-backdrop" id="policy-backdrop"></div><section class="panel policy-modal" id="policy-modal"></section>
  <script>
    (()=>{
      const $=id=>document.getElementById(id), selected=new Set();let currentPage=1,totalPages=1,sortBy='createdAt',sortDir='desc';
      const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const size=v=>{let n=Number(v||0),u=['B','KB','MB','GB','TB'],i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return(i?n.toFixed(1):n)+' '+u[i]};
      const date=v=>v?new Date(v).toLocaleString('ko-KR'):'-';
      const localValue=v=>{if(!v)return'';const d=new Date(v),pad=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`};
      async function api(url,opt){const r=await fetch(url,opt);if(!r.ok){let m='요청 처리 실패';try{const p=await r.json();m=p.detail||p.message||m}catch(_e){}throw new Error(m)}return r.status===204?null:r.json()}
      const badge=v=>`<span class="badge ${esc(v)}">${esc(v||'NOT_QUEUED')}</span>`;
      function selectedValues(id){return [...$(id).querySelectorAll('input[type=checkbox]:checked')].map(input=>input.value)}
      function refreshFilterLabel(id){const root=$(id),values=selectedValues(id),all=root.dataset.allLabel||'전체';root.querySelector('summary').textContent=!values.length?all:values.length===1?values[0]:`${values.length}개 선택`}
      function bindFilter(id){const root=$(id);root.querySelectorAll('input[type=checkbox]').forEach(input=>input.onchange=()=>{refreshFilterLabel(id);currentPage=1;load().catch(error=>alert(error.message))});root.querySelector('.clear-filter').onclick=event=>{event.preventDefault();root.querySelectorAll('input[type=checkbox]').forEach(input=>input.checked=false);refreshFilterLabel(id);root.open=false;currentPage=1;load().catch(error=>alert(error.message))};refreshFilterLabel(id)}
      function sortable(label,key){const mark=sortBy===key?(sortDir==='asc'?'▲':'▼'):'';return `<button type="button" class="sort-button" data-sort="${esc(key)}"><span>${esc(label)}</span><span class="sort-mark">${mark}</span></button>`}
      function renderHead(){$('head-row').innerHTML=`<th class="select-cell"><input id="select-all" type="checkbox" aria-label="현재 페이지 전체 선택"></th><th>${sortable('생성 시각','createdAt')}</th><th>${sortable('의뢰번호','requestNumber')}</th><th>${sortable('프로젝트','experimentCode')}</th><th>${sortable('장비 / 실험자','equipmentCode')}</th><th>${sortable('생성 상태','status')}</th><th>${sortable('전송 상태','transferStatus')}</th><th>파일</th><th>${sortable('용량','fileSize')}</th><th>${sortable('보존','retentionUntil')}</th><th>${sortable('최근 오류','lastError')}</th>`;document.querySelectorAll('.sort-button').forEach(button=>button.onclick=()=>{const key=button.dataset.sort;if(sortBy===key)sortDir=sortDir==='asc'?'desc':'asc';else{sortBy=key;sortDir=key==='createdAt'?'desc':'asc'}currentPage=1;renderHead();load().catch(error=>alert(error.message))});$('select-all').onchange=event=>{document.querySelectorAll('.row-select').forEach(input=>event.target.checked?selected.add(input.value):selected.delete(input.value));updateSelection()}}
      function renderPager(){currentPage=Math.min(Math.max(1,currentPage),Math.max(1,totalPages));$('page-info').textContent=`${currentPage} / ${totalPages}`;$('page-jump').value=String(currentPage);$('page-jump').max=String(totalPages);$('first-page').disabled=$('prev-page').disabled=currentPage<=1;$('last-page').disabled=$('next-page').disabled=currentPage>=totalPages;const start=Math.max(1,Math.min(currentPage-2,totalPages-4)),end=Math.min(totalPages,start+4);$('page-numbers').innerHTML=Array.from({length:Math.max(0,end-start+1)},(_v,index)=>{const page=start+index;return `<button type="button" data-page="${page}" class="${page===currentPage?'active':''}" aria-current="${page===currentPage?'page':'false'}">${page}</button>`}).join('');$('page-numbers').querySelectorAll('button').forEach(button=>button.onclick=()=>goPage(Number(button.dataset.page)))}
      function goPage(page){const next=Math.min(Math.max(1,Number(page)||1),totalPages);if(next===currentPage){renderPager();return}currentPage=next;load().catch(error=>alert(error.message))}
      function updateSelection(){document.querySelectorAll('.row-select').forEach(c=>c.checked=selected.has(c.value));$('selected-count').textContent=`${selected.size}건 선택`;$('cleanup-selected').disabled=!selected.size;const all=[...document.querySelectorAll('.row-select')],selectAll=$('select-all');if(!selectAll)return;selectAll.checked=Boolean(all.length)&&all.every(c=>selected.has(c.value));selectAll.indeterminate=all.some(c=>selected.has(c.value))&&!selectAll.checked}
      function renderSummary(s){const projects=Object.entries(s.projects||{}).sort().map(([k,v])=>`${esc(k)} ${esc(v.count)}건 / ${esc(size(v.sizeBytes))}`).join(' · ')||'프로젝트별 기록 없음';const orphans=(s.orphanFiles||[]).map(f=>`<li><code>${esc(f.relativePath)}</code> (${esc(size(f.sizeBytes))})</li>`).join('');$('summary').innerHTML=`<div class="summary-row"><b>프로젝트별 사용량</b><span>${projects}</span></div><details><summary>DB에 등록되지 않은 파일 ${esc(s.orphanFileCount)}개</summary>${orphans?`<ul>${orphans}</ul>`:'<p class="muted">없음</p>'}</details>`}
      async function load(){const p=new URLSearchParams({q:$('query').value,experimentCode:selectedValues('project').join(','),transferStatus:selectedValues('status').join(','),dateFrom:$('date-from').value,dateTo:$('date-to').value,sortBy,sortDir,page:String(currentPage),pageSize:$('page-size').value});const [data,s]=await Promise.all([api('/api/v1/report-management?'+p),api('/api/v1/report-management/summary')]);currentPage=Number(data.page||1);totalPages=Math.max(1,Number(data.totalPages||1));renderPager();$('report-count').textContent=s.reportCount+'건';$('registered-size').textContent=size(s.totalSizeBytes);$('physical-size').textContent=size(s.physicalStorageBytes);$('trash-size').textContent=size(s.trashSizeBytes);$('missing-count').textContent=s.missingFileCount+'개';$('orphan-count').textContent=s.orphanFileCount+'개';renderSummary(s);$('empty').hidden=Boolean(data.items.length);$('rows').innerHTML=data.items.map(item=>`<tr data-id="${esc(item.report_id)}"><td class="select-cell"><input class="row-select" type="checkbox" value="${esc(item.report_id)}" aria-label="${esc(item.request_number||item.report_id)} 선택"></td><td>${esc(date(item.generated_at||item.created_at))}</td><td>${esc(item.request_number||'-')}</td><td>${esc(item.experiment_code)}${item.is_test?' · 테스트':''}</td><td>${esc(item.equipment_code||'-')}<br><span class="muted">${esc(item.operator_id||'-')}</span></td><td>${badge(item.generation_status)}</td><td>${badge(item.transfer_status)}<br><span class="muted">${esc(item.attempt_count||0)} / ${esc(item.max_attempts||'-')}</span></td><td>${esc(item.active_artifact_count||0)}개${item.missing_artifact_count?`<br><span class="warn">누락 ${esc(item.missing_artifact_count)}</span>`:''}</td><td>${esc(size(item.artifact_size_bytes))}</td><td>${item.pinned?'보존 지정':esc(item.retentionPolicy)}<br><span class="muted">${esc(date(item.retentionDeadline))}</span>${item.retentionPolicyKey&&!item.autoCleanupEnabled?'<br><span class="warn">자동 정리 중지</span>':''}</td><td class="${item.last_error_message?'warn':''}">${esc(item.last_error_message||'-')}</td></tr>`).join('');document.querySelectorAll('tr[data-id]').forEach(row=>row.onclick=e=>{if(e.target.closest('input,button,a'))return;show(row.dataset.id).catch(err=>alert(err.message))});document.querySelectorAll('.row-select').forEach(c=>c.onchange=()=>{c.checked?selected.add(c.value):selected.delete(c.value);updateSelection()});updateSelection()}
      function close(){$('detail').className='panel detail';$('detail').innerHTML='';$('backdrop').className='detail-backdrop';document.body.classList.remove('detail-open')}
      function closePolicies(){$('policy-modal').className='panel policy-modal';$('policy-modal').innerHTML='';$('policy-backdrop').className='policy-backdrop';document.body.classList.remove('policy-open')}
      async function openPolicies(){const data=await api('/api/v1/report-management/policies');const rows=(data.policies||[]).map(p=>`<div class="policy-row" data-key="${esc(p.policyKey)}"><div><b>${esc(p.label)}</b><span class="muted">${esc(p.description)}</span></div><label><span class="muted">보존일</span><input class="policy-days" type="number" min="1" max="3650" value="${esc(p.retentionDays)}" aria-label="${esc(p.label)} 보존일"></label><label class="policy-toggle"><input class="policy-enabled" type="checkbox" ${p.autoCleanupEnabled?'checked':''}>자동 정리 실행</label></div>`).join('');const fixed=(data.fixedRules||[]).map(rule=>`<p><b>${esc(rule.label)}</b><br><span class="muted">${esc(rule.description)}</span></p>`).join('');$('policy-modal').innerHTML=`<div class="toolbar"><b>보존 정책 설정</b><button id="close-policies" title="닫기" aria-label="닫기">&times;</button></div><div class="content"><p class="policy-intro">저장 즉시 다음 조회와 자동 정리 작업부터 적용됩니다. 서비스 재시작은 필요하지 않습니다.</p><div class="policy-list">${rows}</div><div class="fixed-rules"><b>변경할 수 없는 안전 규칙</b>${fixed}</div></div><div class="policy-actions"><button id="cancel-policies">취소</button><button class="primary" id="save-policies">전체 저장</button></div>`;$('policy-modal').className='panel policy-modal open';$('policy-backdrop').className='policy-backdrop open';document.body.classList.add('policy-open');$('close-policies').onclick=closePolicies;$('cancel-policies').onclick=closePolicies;$('save-policies').onclick=savePolicies}
      async function savePolicies(){const button=$('save-policies'),policies={};document.querySelectorAll('.policy-row').forEach(row=>{policies[row.dataset.key]={retentionDays:Number(row.querySelector('.policy-days').value),autoCleanupEnabled:row.querySelector('.policy-enabled').checked}});button.disabled=true;button.textContent='저장 중';try{await api('/api/v1/report-management/policies',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({policies,actor:'운영 관리자'})});closePolicies();await load()}catch(error){button.disabled=false;button.textContent='전체 저장';alert(error.message)}}
      async function show(id){const item=await api('/api/v1/report-management/'+encodeURIComponent(id));const artifacts=(item.artifacts||[]).map(a=>`<div class="artifact"><b>${esc(a.artifact_type)}</b><div>${a.downloadUrl?`<a href="${esc(a.downloadUrl)}">${esc(a.file_name)}</a>`:esc(a.file_name)}<br><span class="muted code">${esc(a.relative_path)}</span></div><span>${esc(size(a.actualSizeBytes??a.size_bytes))}</span><span class="${!a.exists||!a.sizeMatches?'warn':''}">${a.deleted_at?'휴지통':!a.exists?'파일 없음':a.sizeMatches?'정상':'크기 불일치'}</span></div>`).join('')||'<p class="muted">등록된 파일이 없습니다.</p>';const attempts=(item.attempts||[]).map(a=>`<div class="attempt"><b>${esc(a.attempt_no)}차 · ${a.success===1?'성공':a.success===0?'실패':'처리 중'}</b> ${esc(date(a.started_at))}<br><span class="muted">${esc(a.error_message||a.response_message||'-')}</span></div>`).join('')||'<p class="muted">전송 시도 기록이 없습니다.</p>';$('detail').className='panel detail open';$('backdrop').className='detail-backdrop open';document.body.classList.add('detail-open');$('detail').innerHTML=`<div class="toolbar"><b>보고서 상세</b><button id="close" title="닫기" aria-label="닫기">&times;</button></div><div class="content"><div class="head"><div><h2>${esc(item.request_number||'의뢰번호 없음')} · ${esc(item.experiment_code)}</h2><span class="muted code">${esc(item.report_id)}</span></div>${badge(item.transfer_status)}</div><div class="actions"><button id="verify">SHA-256 검증</button><button id="test">${item.is_test?'테스트 해제':'테스트 표시'}</button><button id="pin">${item.pinned?'보존 해제':'보존 지정'}</button>${['FAILED','CANCELLED'].includes(item.transfer_status)?'<button id="retry">전송 재시도</button>':''}${['PENDING','RETRY_WAIT'].includes(item.transfer_status)?'<button id="cancel">대기 전송 취소</button>':''}${item.cleanupEligible?'<button class="danger" id="cleanup">휴지통 이동</button>':''}</div><div class="retention"><label for="retention"><b>직접 보존 기한</b></label><input id="retention" type="datetime-local" value="${esc(localValue(item.retention_until))}"><button id="save-retention">저장</button><button id="clear-retention">자동 정책 적용</button></div><div class="meta"><div><b>생성 시각</b>${esc(date(item.generated_at))}</div><div><b>장비</b>${esc(item.equipment_code||'-')}</div><div><b>실험자</b>${esc(item.operator_id||'-')}</div><div><b>보존 정책</b>${esc(item.retentionPolicy)}</div><div><b>정리 가능 시각</b>${esc(date(item.retentionDeadline))}</div><div><b>LIMS 완료</b>${esc(date(item.transfer_completed_at))}</div><div><b>공유 저장소 경로</b><span class="code">${esc(item.package_relative_path||'-')}</span></div><div><b>삭제 상태</b>${esc(date(item.deleted_at))}</div><div><b>최근 오류</b>${esc(item.last_error_message||'-')}</div></div><h3>파일</h3>${artifacts}<h3>전송 시도</h3>${attempts}</div>`;$('close').onclick=close;$('verify').onclick=async()=>{const result=await api('/api/v1/report-management/'+encodeURIComponent(id)+'/verify',{method:'POST'});alert(result.valid?'모든 파일의 SHA-256이 일치합니다.':'누락 또는 해시 불일치 파일이 있습니다.');await show(id)};$('test').onclick=()=>patch(id,{isTest:!item.is_test});$('pin').onclick=()=>patch(id,{pinned:!item.pinned});$('save-retention').onclick=()=>patch(id,{retentionUntil:$('retention').value||null,updateRetention:true});$('clear-retention').onclick=()=>patch(id,{retentionUntil:null,updateRetention:true});const retry=$('retry'),cancel=$('cancel'),cleanup=$('cleanup');if(retry)retry.onclick=()=>action(id,'retry');if(cancel)cancel.onclick=()=>action(id,'cancel');if(cleanup)cleanup.onclick=()=>cleanupReports([id])}
      async function patch(id,payload){await api('/api/v1/report-management/'+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});await show(id);await load()}
      async function action(id,name){await api('/api/v1/report-management/'+encodeURIComponent(id)+'/'+name,{method:'POST'});await show(id);await load()}
      async function cleanupReports(ids){if(!ids.length)return;if(!confirm(`${ids.length}건의 파일을 휴지통으로 이동할까요? DB 이력은 유지됩니다.`))return;await api('/api/v1/report-management/cleanup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reportIds:ids,actor:'운영 관리자',reason:'관리 화면 선택 정리'})});ids.forEach(id=>selected.delete(id));close();await load()}
      async function logout(){const button=$('logout-button');button.disabled=true;try{const response=await fetch('/api/v1/auth/logout',{method:'POST',headers:{'X-Requested-With':'RIST-Operations'}});if(!response.ok)throw new Error('로그아웃하지 못했습니다.');location.href='/login'}catch(error){button.disabled=false;alert(error.message)}}
      $('refresh').onclick=()=>{currentPage=1;load().catch(e=>alert(e.message))};$('cleanup-preview').onclick=async()=>{try{const data=await api('/api/v1/report-management/cleanup-preview');selected.clear();data.items.forEach(i=>selected.add(i.report_id));updateSelection();alert(`자동 정리 대상 ${data.count}건, ${size(data.sizeBytes)}를 선택했습니다. 목록을 검토한 뒤 휴지통 이동을 실행하세요.`)}catch(e){alert(e.message)}};$('cleanup-selected').onclick=()=>cleanupReports([...selected]).catch(e=>alert(e.message));$('clear-selection').onclick=()=>{selected.clear();updateSelection()};$('query').onkeydown=e=>{if(e.key==='Enter')$('refresh').click()};$('page-size').onchange=()=>{currentPage=1;load().catch(e=>alert(e.message))};$('first-page').onclick=()=>goPage(1);$('prev-page').onclick=()=>goPage(currentPage-1);$('next-page').onclick=()=>goPage(currentPage+1);$('last-page').onclick=()=>goPage(totalPages);$('go-page').onclick=()=>goPage($('page-jump').value);$('page-jump').onkeydown=e=>{if(e.key==='Enter')$('go-page').click()};$('all-dates').onclick=()=>{$('date-from').value='';$('date-to').value='';currentPage=1;load().catch(e=>alert(e.message))};$('date-from').onchange=$('date-to').onchange=()=>{currentPage=1;load().catch(e=>alert(e.message))};bindFilter('project');bindFilter('status');document.querySelectorAll('.multi-filter').forEach(root=>root.addEventListener('toggle',()=>{if(!root.open)return;document.querySelectorAll('.multi-filter').forEach(other=>{if(other!==root)other.open=false})}));document.addEventListener('click',event=>{if(event.target.closest('.multi-filter'))return;document.querySelectorAll('.multi-filter[open]').forEach(root=>root.open=false)});$('open-policies').onclick=()=>openPolicies().catch(e=>alert(e.message));$('logout-button').onclick=logout;$('backdrop').onclick=close;$('policy-backdrop').onclick=closePolicies;document.addEventListener('keydown',e=>{if(e.key==='Escape'){close();closePolicies();document.querySelectorAll('.multi-filter[open]').forEach(root=>root.open=false)}});renderHead();load().catch(e=>alert(e.message));
    })();
  </script>
