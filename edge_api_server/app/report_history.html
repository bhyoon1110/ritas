<header class="top"><div class="top-inner"><a class="brand" href="/">RIST 분석 포털</a><nav class="nav" aria-label="회원 메뉴"><a class="button secondary" href="/">대시보드</a><a class="button secondary" href="/account">회원정보 관리</a></nav></div></header>
<main><h1>내 보고서 이력</h1><p class="intro muted">내 계정으로 생성한 보고서의 파일, 전송 결과와 오류를 확인하세요.</p>
<form id="history-filters" class="panel" aria-label="보고서 검색 조건"><div class="filters">
<div class="field search"><label for="history-query">의뢰번호 · 보고서 ID</label><input id="history-query" name="q" type="search" maxlength="128" placeholder="의뢰번호 또는 보고서 ID 입력"></div>
<div class="field"><label for="history-project">분석 종류</label><select id="history-project" name="project"><option value="">전체 분석</option><option value="FTIR">FT-IR</option><option value="RAMAN">Raman</option><option value="XRD">XRD</option><option value="TEM">TEM</option></select></div>
<div class="field"><label for="history-status">전송 상태</label><select id="history-status" name="transferStatus"><option value="">전체 상태</option><option value="NOT_QUEUED">전송 전</option><option value="PENDING">전송 대기</option><option value="PROCESSING">전송 중</option><option value="RETRY_WAIT">재확인 대기</option><option value="COMPLETED">처리 완료</option><option value="FAILED">전송 실패</option><option value="CANCELLED">전송 취소</option></select></div>
<div class="field"><label for="history-from">생성일 시작</label><input id="history-from" name="dateFrom" type="date"></div>
<div class="field"><label for="history-to">생성일 종료</label><input id="history-to" name="dateTo" type="date"></div>
</div><div class="filter-actions"><button id="history-search" type="submit">조회</button><button id="history-reset" class="secondary" type="button">조건 초기화</button><button id="history-refresh" class="secondary" type="button">상태 새로고침</button></div></form>
<p id="history-notice" class="notice" role="status" aria-live="polite" hidden></p><a id="history-login" class="login-link" href="/login?returnTo=%2Fmy%2Freports" hidden>로그인 화면으로 이동</a>
<section class="panel" aria-labelledby="history-title"><div class="results-head"><div><h2 id="history-title">보고서 목록</h2><p id="history-count" class="muted" aria-live="polite">조회 중…</p></div><div class="results-meta"><label for="history-page-size">한 페이지</label><select id="history-page-size"><option value="20">20건</option><option value="50">50건</option><option value="100">100건</option></select></div></div>
<div id="history-list" class="report-list" aria-busy="true"><p class="empty">보고서 이력을 불러오고 있습니다.</p></div>
<div class="pager"><span id="history-updated" class="muted"></span><nav class="pager-controls" aria-label="보고서 목록 페이지"><button id="history-prev" class="secondary" type="button" disabled>이전</button><span id="history-page" aria-live="polite">—</span><button id="history-next" class="secondary" type="button" disabled>다음</button></nav></div></section>
<p class="footnote">생성 중이거나 생성에 실패한 작업은 <a href="/#recent-panel">대시보드의 최근 작업</a>에서 확인하세요. 로컬 파일 보관 기간이 지나도 등록된 이력과 전송 결과는 확인할 수 있습니다. 메일 서버 전달 완료는 수신자의 수신 확인과 구분됩니다.</p>
<noscript><p class="notice">보고서 이력 조회에는 JavaScript가 필요합니다.</p></noscript>
</main><script src="/assets/report_delivery_progress.js"></script><script src="/assets/report_history.js"></script></body></html>
