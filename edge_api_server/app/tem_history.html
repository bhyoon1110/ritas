<style>
  #tem-history[hidden] { display:none !important; }
  #tem-history { position:fixed; top:0; left:0; right:0; bottom:0; z-index:10000; background:rgba(17,35,55,.5); display:flex; align-items:center; justify-content:center; padding:12px; box-sizing:border-box; }
  #tem-history .th-panel { display:flex; flex-direction:column; width:980px; height:820px; max-width:100%; max-height:100%; background:white; color:#172a46; padding:20px; border-radius:10px; box-sizing:border-box; font:14px/1.5 Arial,'Malgun Gothic',sans-serif; }
  #tem-history .th-panel > * { flex-shrink:0; }
  #tem-history .th-heading, #tem-history .th-controls, #tem-history .th-row, #tem-history .th-actions { display:flex; align-items:center; flex-wrap:wrap; gap:8px; }
  #tem-history .th-heading { justify-content:space-between; }
  #tem-history h2 { margin:0; font-size:20px; }
  #tem-history button, #tem-history a { border:1px solid #cbd5e1; border-radius:6px; background:#fff; color:#17486a; padding:7px 10px; font:inherit; white-space:nowrap; text-decoration:none; cursor:pointer; flex-shrink:0; }
  #tem-history button:disabled { opacity:.5; cursor:default; }
  #tem-history input, #tem-history select { min-height:36px; border:1px solid #cbd5e1; border-radius:5px; padding:6px 8px; font:inherit; box-sizing:border-box; max-width:100%; }
  #tem-history input { width:100%; }
  #tem-history .th-search { flex:1 1 200px; min-width:0; }
  #tem-history .th-help { color:#52677c; margin:10px 0; overflow-wrap:break-word; }
  #tem-history .th-list { flex:1 1 250px; min-height:70px; overflow:auto; margin:10px 0; overscroll-behavior:contain; }
  #tem-history .th-row { border-bottom:1px solid #d6e0ea; padding:10px 0; }
  #tem-history .th-info { flex:1 1 270px; min-width:0; }
  #tem-history .th-info p { margin:5px 0; overflow-wrap:break-word; font-size:12px; color:#52677c; }
  #tem-history .th-error { color:#a02727; }
  #tem-history .th-danger { color:#a02727; border-color:#e0bbbb; }
  #tem-history .th-footer { display:flex; align-items:center; flex-wrap:wrap; gap:8px; }
  #tem-history :focus { outline:2px solid #3b82b5; outline-offset:2px; }
  @media(max-width:520px) { #tem-history { padding:6px; } #tem-history .th-panel { padding:12px; } #tem-history .th-actions { width:100%; } }
  @media(max-height:520px) { #tem-history .th-panel { overflow:auto; } #tem-history .th-list { flex:none; max-height:240px; } }
</style>
<div id="tem-history" hidden role="dialog" aria-modal="true" aria-labelledby="tem-history-title">
  <div class="th-panel">
    <div class="th-heading"><h2 id="tem-history-title">TEM 작업 이력</h2><button id="th-close" type="button">닫기</button></div>
    <p class="th-help" id="th-policy">작업 이력을 불러오는 중입니다.</p>
    <p class="th-help">작성자 본인과 관리자만 조회·관리합니다. 보고서는 새 창에서 열립니다. 작업 이력 정리는 LIMS 전송용 공유 보고서를 삭제하지 않습니다.</p>
    <div class="th-controls">
      <label class="th-search">작업명·의뢰번호·작업 ID 검색<input id="th-search" type="search" maxlength="120" placeholder="작업명 또는 의뢰번호"></label>
      <label>보기 <select id="th-filter"><option value="active">작업 목록</option><option value="trash">휴지통</option></select></label>
      <button id="th-refresh" type="button">새로고침</button>
    </div>
    <p id="th-notice" role="status" aria-live="polite"></p>
    <div id="th-list" class="th-list" aria-label="작업 목록"></div>
    <div class="th-footer"><button id="th-prev" type="button">이전</button><span id="th-page"></span><button id="th-next" type="button">다음</button><button id="th-empty" type="button" class="th-danger" hidden>이 페이지 휴지통 비우기</button></div>
  </div>
</div>
<script>/* TEM_HISTORY_SCRIPT */</script>
